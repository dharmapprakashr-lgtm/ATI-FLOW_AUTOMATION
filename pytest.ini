[pytest]
# testpaths is intentionally not set so that pytest uses the current working
# directory as the collection root. This lets you run `pytest` from any
# sub-directory (e.g. tests/ui, tests/api) and collect only that suite.
# To run everything from the project root: pytest tests/
cache_dir = .cache/pytest
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The run report is reports/report_<timestamp>.pdf, built by conftest.py.
# pytest-html is deliberately not enabled here: reports/ holds PDFs only.
# Add --html=<path> --self-contained-html on the command line if you want one;
# a relative path is resolved against the repo root, not the working directory.
addopts =
    -v
    --strict-markers
    -ra

xfail_strict = true

markers =
    ui: browser UI tests
    api: HTTP API contract tests
    api_model: legacy MTS model and mock API harness checks
    integration: API and browser consistency checks
    admin: admin console tests
    requester: requester role tests
    dispatcher: dispatcher role tests
    supervisor: supervisor role tests
    smoke: fast critical-path checks
    e2e: full cross-role workflow tests
    crud: create, read, update, and delete lifecycle checks
    auth: authentication and session tests
    access_control: role-based access control tests
    admin_pa: processing area admin tests
    exec_config: execution source config tests
    settings: settings module tests
    dashboards: dashboard tests for all roles
    security: XSS and injection security tests
    nfr: non-functional requirements
    ui_nav: UI navigation and form tests
    regression: regression suite — full sweep, run on release candidates

# Session-scoped fixtures warn via `warnings.warn` when teardown leaves data on
# the app; keep them visible rather than filtered.
filterwarnings =
    always::UserWarning
